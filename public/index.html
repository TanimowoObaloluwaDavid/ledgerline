<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ledgerline</title>
    <meta
      name="description"
      content="A double-entry accounting book: journal, chart of accounts, trial balance, financial statements."
    />
    <link rel="stylesheet" href="/app/assets/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M9 8h14M9 16h14M9 24h9' stroke='%2334d399' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="shell">
      <header class="topbar">
        <div class="topbar__brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="7" />
            <path d="M9 8h14M9 16h14M9 24h9" />
          </svg>
          <div>
            <strong>Ledgerline</strong>
            <span class="topbar__sub" id="book-meta">loading the book…</span>
          </div>
        </div>
        <div class="topbar__actions">
          <span class="chip" id="verify-chip" title="Journal integrity">checking…</span>
          <button class="button button--primary" id="new-entry-shortcut" type="button">
            New entry
          </button>
        </div>
      </header>

      <nav class="tabs" aria-label="Sections">
        <button class="tab" type="button" data-view="dashboard" aria-current="page">Dashboard</button>
        <button class="tab" type="button" data-view="entry">New entry</button>
        <button class="tab" type="button" data-view="journal">Journal</button>
        <button class="tab" type="button" data-view="accounts">Accounts</button>
        <button class="tab" type="button" data-view="reports">Reports</button>
        <button class="tab" type="button" data-view="rates">Currencies</button>
        <button class="tab" type="button" data-view="close">Close period</button>
      </nav>

      <main id="view" class="view" tabindex="-1">
        <p class="loading">Opening the book…</p>
      </main>

      <footer class="footer">
        <span>Double-entry, exact to the cent.</span>
        <nav aria-label="Reference">
          <a href="/health">health</a>
          <a href="/">API index</a>
        </nav>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <dialog class="dialog" id="dialog">
      <form method="dialog" class="dialog__inner" id="dialog-form">
        <h2 id="dialog-title">Confirm</h2>
        <p id="dialog-body"></p>
        <menu class="dialog__actions">
          <button class="button" value="cancel" type="submit">Cancel</button>
          <button class="button button--primary" value="confirm" type="submit" id="dialog-confirm">
            Confirm
          </button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app/app.js"></script>
  </body>
</html>
